spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/bang9?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${DB_USER:bang9}
    password: ${DB_PASSWORD:bang9}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT_INNER:6379}
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  upload:
    mode: ${UPLOAD_MODE:local}
    local:
      storage-path: ${UPLOAD_LOCAL_PATH:./uploads}
      public-base-url: ${UPLOAD_LOCAL_PUBLIC_URL:http://10.0.2.2:8089}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  vworld:
    api-key: ${VWORLD_API_KEY:}
  geocoding:
    provider: ${GEOCODING_PROVIDER:vworld}

logging:
  level:
    root: INFO
    kr.bang9: DEBUG
    org.mybatis: DEBUG

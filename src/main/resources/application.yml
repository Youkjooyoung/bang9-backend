spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: bang9-backend
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:placeholder}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:placeholder}
            redirect-uri: "${OAUTH_BASE_URL:http://10.0.2.2:8089}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:placeholder}
            redirect-uri: "${OAUTH_BASE_URL:http://10.0.2.2:8089}/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            client-name: Google
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8089}
  servlet:
    encoding:
      charset: UTF-8
      force: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-at-least-64-bytes-for-hs512-security}
  access-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:30}
  refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:14}

aes:
  secret-key: ${AES_SECRET_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3-bucket: ${AWS_S3_BUCKET:bang9-local}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  oauth:
    client-id: ${KAKAO_OAUTH_CLIENT_ID:}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}

app:
  oauth2:
    success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:5180/oauth/success}

portone:
  imp-key: ${PORTONE_IMP_KEY:}
  imp-secret: ${PORTONE_IMP_SECRET:}

codex:
  base-url: ${CODEX_BASE_URL:https://api.openai.com}
  api-key: ${CODEX_API_KEY:}
  model: ${CODEX_MODEL:gpt-5.4-mini}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:no-reply@bang9.local}

publicdata:
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: bang9-backend
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    kr.bang9: DEBUG

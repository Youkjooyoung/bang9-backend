spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT_INNER:6379}
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

app:
  upload:
    mode: ${UPLOAD_MODE:s3}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  vworld:
    api-key: ${VWORLD_API_KEY:}
  geocoding:
    provider: ${GEOCODING_PROVIDER:vworld}

logging:
  level:
    root: WARN
    kr.bang9: INFO
